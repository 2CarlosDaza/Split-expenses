spring:
  application:
    name: split-expense

  datasource:
    url: jdbc:postgresql://localhost:5432/splitdb
    username: ${DB_USERNAME:split_user}
    password: ${DB_PASSWORD:split_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: split-expense-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.carlosdaza.splitexpense.domain.dto"

kafka:
  topics:
    expense-events: expense-events

jwt:
  secret: ${JWT_SECRET:myVerySecretKeyForSplitExpenseAppThatIsLongEnough256Bits}
  expiration-ms: 86400000  # 24 hours

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
